[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-atendimento"
version = "0.1.0"
description = "Lia: agente de atendimento ao cliente com tool use e motor local por regras"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atendimento = "cli:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["cli"]
